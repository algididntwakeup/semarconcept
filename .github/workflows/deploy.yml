name: Deploy to Staging (Self-Hosted Runner)

on:
  push:
    branches:
      - staging
      - main

jobs:


  deploy:
    name: Build & Deploy
    # Menggunakan tags 'self-hosted' yang biasanya digunakan untuk server private
    runs-on: self-hosted

    steps:
      - name: Fix Workspace Permissions Before Checkout
        run: |
          # Fix permission issues where files created by Docker (as root) cannot be deleted by actions/checkout
          # Fallback to docker run chown if sudo requires password or isn't available
          sudo chown -R $USER:$USER ${{ github.workspace }} || \
          docker run --rm -v ${{ github.workspace }}:/workspace alpine sh -c "chown -R $(id -u):$(id -g) /workspace" || true

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Docker Status
        run: |
          docker --version
          docker compose version

      - name: Prepare Environment / Settings
        run: |
          # Pada runner production/staging, idealnya .env dan docker-compose.yml (dengan credentials asli)
          # sudah disiapkan manual di path terpisah dan disymlink/copy oleh script ini, 
          # Atau menggunakan Github Secrets dan menyuntikkannya ke dalam file saat dieksekusi.
          
          # Jika file docker-compose.yml belum ada di server, copy dari template example (hanya untuk fallback)
          if [ ! -f "docker-compose.yml" ]; then
            echo "docker-compose.yml is missing, creating from example fallback..."
            cp docker-compose.example.yml docker-compose.yml
          fi

          # Optional: Buat file .env kosong jika Anda bergantung padanya
          if [ ! -f "backend/.env" ]; then
            touch backend/.env
          fi

      - name: Build and Deploy using Docker Compose
        run: |
          echo "Memulai proses build & deployment..."
          
          # Fix bug: old example template created a 33-byte key which causes Go backend to crash in init()
          if [ -f "docker-compose.yml" ]; then
            sed -i 's/your_32_bytes_encryption_key_here/your_32_byte_encryption_key_here/g' docker-compose.yml
          fi
          
          # Matikan dan hapus container (jika ada perubahan file docker-compose.yml dsb)
          docker compose down
          
          # Jalankan di background dan paksa build layer terbaru, tunggu (wait) sampai container sehat
          docker compose up -d --build --wait

      # - name: Execute Database Seeder (Opsional)
      #   run: |
      #     # Eksekusi seeder secara manual karena memakan resource dan bisa menyebabkan crash di staging CI/CD
      #     echo "Seeder dinonaktifkan dari pipeline. Jalankan manual via: docker exec semar-backend ./reksolindo-backend -seed=true"
      #     # docker exec semar-backend ./reksolindo-backend -seed=true

      - name: Clean up Unused Docker Resources
        run: |
          echo "Membersihkan dangling images (image bekas build yang menumpuk)..."
          docker image prune -f
