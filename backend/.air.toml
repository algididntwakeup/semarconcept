# .air.toml
root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o tmp/main.exe ."
bin = "tmp/main.exe"
full_bin = "tmp\\main.exe"
include_ext = ["go", "tpl", "tmpl", "html"]
exclude_dir = ["assets", "tmp", "vendor", "bin"]

[log]
time = true

[color]
main = "magenta"
watcher = "cyan"
build = "yellow"
runner = "green"

[misc]
clean_on_exit = true