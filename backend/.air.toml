root = "."
tmp_dir = "tmp/air"

[build]
cmd = "go build -o ./tmp/air/semar ./main.go"
entrypoint = ["./tmp/air/semar"]
include_ext = ["go", "yaml", "yml"]
exclude_dir = ["storage", "tmp", "vendor"]
exclude_regex = ["_test.go"]
poll = true
poll_interval = 1000
delay = 500
stop_on_error = true
send_interrupt = true
kill_delay = "500ms"

[log]
time = true

[screen]
clear_on_rebuild = false
keep_scroll = true
