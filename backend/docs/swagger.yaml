host: reksolindo.opuschamber.com
info:
  contact: {}
  description: Multi-tenant enterprise asset management system
  title: Reksolindo Enterprise Asset Management API
  version: "1.0"
paths:
  /api/v1/logs:
    post:
      consumes:
      - application/json
      description: Receives and processes logs from the frontend application
      parameters:
      - description: Log entry from frontend
        in: body
        name: log
        required: true
        schema:
          $ref: '#/definitions/backend_route-fix-backup-20250603_161334_handlers.LogEntry'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Handle frontend logs
      tags:
      - logs
  /api/v1/logs/batch:
    post:
      consumes:
      - application/json
      description: Receives and processes multiple logs from the frontend application
      parameters:
      - description: Array of log entries from frontend
        in: body
        name: logs
        required: true
        schema:
          items:
            $ref: '#/definitions/backend_route-fix-backup-20250603_161334_handlers.LogEntry'
          type: array
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Handle batch frontend logs
      tags:
      - logs
  /audit-logs:
    get:
      consumes:
      - application/json
      description: Retrieves a paginated list of audit logs, optionally filtered.
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 10
        description: Number of items per page
        in: query
        name: limit
        type: integer
      - description: Filter by User ID
        in: query
        name: user_id
        type: integer
      - description: Filter by action
        in: query
        name: action
        type: string
      - description: Filter by resource type
        in: query
        name: resource_type
        type: string
      - description: Filter by start date (YYYY-MM-DDTHH:MM:SSZ)
        in: query
        name: start_date
        type: string
      - description: Filter by end date (YYYY-MM-DDTHH:MM:SSZ)
        in: query
        name: end_date
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Paginated list of audit logs" // Placeholder - replace with
            actual response model
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid query parameters
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Get audit logs
      tags:
      - audit-logs
  /auth/forgot-password:
    post:
      consumes:
      - application/json
      description: Sends a password reset link to the user's email if the account
        exists.
      parameters:
      - description: Email address for password reset
        in: body
        name: email_request
        required: true
        schema:
          $ref: '#/definitions/request.ForgotPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: If an account with that email exists, a reset link has been
            sent.
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid request payload
          schema:
            $ref: '#/definitions/backend_route-fix-backup-20250603_161334_handlers.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/backend_route-fix-backup-20250603_161334_handlers.ErrorResponse'
      summary: Initiate password reset
      tags:
      - auth
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticates a user and returns JWT tokens.
      parameters:
      - description: User login credentials
        in: body
        name: credentials
        required: true
        schema:
          $ref: '#/definitions/request.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Login successful
          schema:
            $ref: '#/definitions/response.LoginResponse'
        "400":
          description: Invalid request payload or validation error
          schema:
            $ref: '#/definitions/backend_route-fix-backup-20250603_161334_handlers.ErrorResponse'
        "401":
          description: Invalid credentials
          schema:
            $ref: '#/definitions/backend_route-fix-backup-20250603_161334_handlers.ErrorResponse'
        "403":
          description: Account inactive
          schema:
            $ref: '#/definitions/backend_route-fix-backup-20250603_161334_handlers.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/backend_route-fix-backup-20250603_161334_handlers.ErrorResponse'
      summary: Log in a user
      tags:
      - auth
  /auth/logout:
    post:
      description: Invalidates the user's session (e.g., clears refresh token cookie).
      produces:
      - application/json
      responses:
        "200":
          description: Logout successful
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Log out a user
      tags:
      - auth
  /auth/me:
    get:
      description: Retrieves details of the currently logged-in user.
      produces:
      - application/json
      responses:
        "200":
          description: Current user details
          schema:
            $ref: '#/definitions/response.UserResponse'
        "401":
          description: Unauthorized - No token or invalid token
          schema:
            $ref: '#/definitions/backend_route-fix-backup-20250603_161334_handlers.ErrorResponse'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/backend_route-fix-backup-20250603_161334_handlers.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/backend_route-fix-backup-20250603_161334_handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get current authenticated user
      tags:
      - auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Provides a new access token using a valid refresh token.
      parameters:
      - description: Refresh token
        in: body
        name: token
        required: true
        schema:
          $ref: '#/definitions/request.RefreshTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Access token refreshed successfully
          schema:
            $ref: '#/definitions/response.TokenResponse'
        "400":
          description: Invalid request payload or missing token
          schema:
            $ref: '#/definitions/backend_route-fix-backup-20250603_161334_handlers.ErrorResponse'
        "401":
          description: Invalid or expired refresh token
          schema:
            $ref: '#/definitions/backend_route-fix-backup-20250603_161334_handlers.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/backend_route-fix-backup-20250603_161334_handlers.ErrorResponse'
      summary: Refresh JWT access token
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Creates a new user account.
      parameters:
      - description: User registration details
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/request.RegisterUserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: User created successfully" // Added response. prefix
          schema:
            $ref: '#/definitions/response.UserResponse'
        "400":
          description: Invalid request payload or validation error
          schema:
            $ref: '#/definitions/backend_route-fix-backup-20250603_161334_handlers.ErrorResponse'
        "409":
          description: Username or email already exists
          schema:
            $ref: '#/definitions/backend_route-fix-backup-20250603_161334_handlers.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/backend_route-fix-backup-20250603_161334_handlers.ErrorResponse'
      summary: Register a new user
      tags:
      - auth
  /auth/reset-password:
    post:
      consumes:
      - application/json
      description: Sets a new password for the user using a valid reset token.
      parameters:
      - description: Password reset token and new password
        in: body
        name: reset_request
        required: true
        schema:
          $ref: '#/definitions/request.ResetPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Password reset successfully
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid request, token, or password complexity
          schema:
            $ref: '#/definitions/backend_route-fix-backup-20250603_161334_handlers.ErrorResponse'
        "401":
          description: Invalid or expired token
          schema:
            $ref: '#/definitions/backend_route-fix-backup-20250603_161334_handlers.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/backend_route-fix-backup-20250603_161334_handlers.ErrorResponse'
      summary: Reset user password
      tags:
      - auth
  /configurations:
    get:
      consumes:
      - application/json
      description: Retrieves a list of configuration items, optionally filtered by
        category.
      parameters:
      - description: Filter by category name
        example: '"General"'
        in: query
        name: category
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Successfully retrieved list of configuration items
          schema:
            items:
              $ref: '#/definitions/models.ConfigurationDTO'
            type: array
        "401":
          description: Unauthorized (JWT invalid or missing)
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: Forbidden (user lacks permission)
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List configuration items
      tags:
      - Configurations
    post:
      consumes:
      - application/json
      description: Creates a new system configuration setting.
      parameters:
      - description: Configuration details
        in: body
        name: config
        required: true
        schema:
          $ref: '#/definitions/api.ConfigCreateUpdateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Successfully created configuration item
          schema:
            $ref: '#/definitions/models.ConfigurationDTO'
        "400":
          description: Invalid request body or validation failed
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized (JWT invalid or missing)
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: Forbidden (user lacks permission)
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "409":
          description: Conflict (configuration key already exists)
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a new configuration item
      tags:
      - Configurations
  /configurations/{id}:
    delete:
      consumes:
      - application/json
      description: Deletes a configuration item by its UUID. Only affects editable
        items by default (repository logic).
      parameters:
      - description: Configuration ID (UUID)
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: Successfully deleted configuration item
        "400":
          description: Invalid configuration ID format
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized (JWT invalid or missing)
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: Forbidden (user lacks permission or item not editable)
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Configuration item not found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete configuration item by ID
      tags:
      - Configurations
  /configurations/bulk:
    post:
      consumes:
      - application/json
      description: Updates multiple configuration items at once. Only updates editable
        items.
      parameters:
      - description: Map of configuration keys to new values
        in: body
        name: configs
        required: true
        schema:
          $ref: '#/definitions/api.BulkUpdateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Bulk update successful
          schema:
            $ref: '#/definitions/api.BulkUpdateResponse'
        "207":
          description: Bulk update partially completed with errors
          schema:
            $ref: '#/definitions/api.BulkUpdateResponse'
        "400":
          description: Invalid request body
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized (JWT invalid or missing)
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: Forbidden (user lacks permission)
