basePath: /api/v1
definitions:
  api.AssignPermissionRequest:
    properties:
      permission_id:
        description: Example UUID
        example: xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx
        type: string
    required:
