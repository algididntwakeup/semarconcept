        example: xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx
        type: string
    required:
    - role_id
    type: object
  api.BulkUpdateRequest:
    properties:
      configs:
        additionalProperties:
          type: string
        description: Map of Key -> New Value
        example:
          '"admin_email"': '"admin@new.com"}'
          '{"site_name"': '"New Site Name"'
        type: object
    required:
    - configs
    type: object
  api.BulkUpdateResponse:
    properties:
      errors:
        additionalProperties:
          type: string
        description: Only include if errors occurred
        type: object
      message:
        type: string
      updated_count:
        type: integer
    type: object
  api.ConfigCreateUpdateRequest:
    properties:
      category:
        example: General
        type: string
      description:
        example: The public name of the website
        type: string
      is_editable:
        example: true
        type: boolean
      is_encrypted:
        description: Optional, defaults to false
        example: false
        type: boolean
      key:
        example: site_name
        type: string
      value:
        description: Value is required, but binding:"required" might fail on empty
          string? Handle manually.
        example: Reksolindo CMS
        type: string
      value_type:
        enum:
        - string
        - int
        - bool
        - json
        example: string
        type: string
    required:
    - is_editable
    - key
    - value_type
    type: object
  api.CreateRoleRequest:
